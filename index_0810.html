<meta charset="UTF-8">

<title>AI 應用程式使用率統計報告</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#f5f7fa; --card:#ffffff; --ink:#1f2937; --muted:#6b7280;
    --border:#e5e7eb; --accent:#2563eb;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
  .wrap{max-width:1100px;margin:0 auto;padding:32px 24px 64px}
  header{margin-bottom:28px}
  h1{font-size:26px;font-weight:700;letter-spacing:.5px}
  .sub{color:var(--muted);font-size:14px;margin-top:6px}
  .updated{color:var(--muted);font-size:12px;margin-top:4px}

  .svc-section{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);margin-bottom:24px;overflow:hidden}
  .svc-header{padding:18px 24px;border-left:5px solid;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
  .svc-header h2{font-size:18px;font-weight:700}
  .svc-header .period{font-size:12px;color:var(--muted)}
  .svc-body{padding:20px 24px}

  .mini-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  .mini-kpi .mk{background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:12px 14px;text-align:center}
  .mini-kpi .mk .l{font-size:11px;color:var(--muted);font-weight:500}
  .mini-kpi .mk .v{font-size:20px;font-weight:700;margin-top:4px}

  .chart-box{position:relative;height:300px;margin-bottom:16px}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--border)}
  th:first-child,td:first-child{text-align:left}
  thead th{background:#f9fafb;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  tbody tr:hover{background:#f9fafb}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}

  .detail-toggle{cursor:pointer;color:var(--accent);font-size:13px;font-weight:500;margin-top:8px;display:inline-block;user-select:none}
  .detail-toggle:hover{text-decoration:underline}
  .detail-wrap{max-height:0;overflow:hidden;transition:max-height .3s ease}
  .detail-wrap.open{max-height:500px;overflow:auto}

  footer{margin-top:32px;color:var(--muted);font-size:12px;text-align:center}

  @media(max-width:780px){
    .mini-kpi{grid-template-columns:repeat(2,1fr)}
    .chart-box{height:240px}
  }
</style>
</head>

const fmt = n => n.toLocaleString('zh-TW');
const sum = arr => arr.reduce((s,[,v])=>s+v,0);

function monthly(arr){
  const m={};
  arr.forEach(([d,v])=>{const k=d.slice(0,7); m[k]=(m[k]||0)+v;});
  return m;
}

function buildSection(svc, idx){
  const arr = DATA[svc.key];
  const total = sum(arr);
  const days = arr.length;
  const avg = (total/days).toFixed(1);
  const peakRow = arr.reduce((mx,r)=>r[1]>mx[1]?r:mx, ['',0]);
  const firstDate = arr[0][0];
  const lastDate = arr[arr.length-1][0];
  const m = monthly(arr);
  const mKeys = Object.keys(m).sort();
  const mVals = mKeys.map(k=>m[k]);
  const peakMonth = mKeys.reduce((pk,k)=>m[k]>m[pk]?k:pk, mKeys[0]);
  const peakMonthVal = m[peakMonth];

  const secId = `sec-${svc.key}`;
  const chartId = `chart-${svc.key}`;

  // AI 護理交班使用特殊渲染（護理站表格 + 折線圖）
  const isNursing = svc.key === 'nursing';

  // KPI 區塊
  const kpiLabels = isNursing
    ? ['累計使用筆數','使用護理站數','平均每月次數','最高單月次數']
    : ['累計使用次數','使用天數','平均每日次數','最高單日次數'];
  const kpiValues = isNursing
    ? [fmt(total), 13, (total/days).toFixed(1), fmt(peakMonthVal)]
    : [fmt(total), days, avg, fmt(peakRow[1])];

  // 護理站表格（僅 AI 護理交班）
  const stationTable = isNursing ? `
        <h3 style="font-size:15px;font-weight:600;margin:20px 0 10px;color:var(--ink)">各護理站各月筆數統計</h3>
        <div style="overflow-x:auto;margin-bottom:16px">

          <th>護理站</th><th>1月</th><th>2月</th><th>3月</th><th>4月</th><th>5月</th><th>6月</th><th>7月</th><th>累計</th>
        </tr></thead><tbody>
        ${NURSING_STATIONS.map(row=>{
          const isTotal = row[0]==='總';
          const style = isTotal ? 'font-weight:700;background:#f3f4f6' : '';
          return `<tr style="${style}"><td>${row[0]}</td>${row.slice(1).map(v=>`<td>${typeof v==='number'?fmt(v):v}</td>`).join('')}</tr>`;
        }).join('')}
        </tbody></table>
        </div>` : '';

  // 高峰資訊
  const peakInfo = isNursing
    ? `最高單月：<b>${peakMonth}</b>（${fmt(peakMonthVal)} 次）`
    : `最高單日：<b>${peakRow[0]}</b>（${fmt(peakRow[1])} 次）　·　最高單月：<b>${peakMonth}</b>（${fmt(peakMonthVal)} 次）`;

  // 每日明細（非護理交班才有）
  const detailSection = isNursing ? '' : `
        <span class="detail-toggle" onclick="toggleDetail('${svc.key}')">▼ 展開每日明細</span>
        <div class="detail-wrap" id="detail-${svc.key}">
          <table style="margin-top:12px"><thead><tr><th>日期</th><th style="text-align:right">使用次數</th></tr></thead><tbody>
          ${arr.slice().sort((a,b)=>b[0].localeCompare(a[0])).map(([d,v])=>
            `<tr><td>${d}</td><td><span class="pill" style="background:${svc.color}22;color:${svc.color}">${fmt(v)}</span></td></tr>`

          </tbody></table>
        </div>`;

  const html = `
    <div class="svc-section" id="${secId}">
      <div class="svc-header" style="border-left-color:${svc.color};background:${svc.color}08">
        <div>
          <h2 style="color:${svc.color}">${idx+1}. ${svc.name}</h2>
          <div class="period">${svc.desc}　|　資料區間：${firstDate} ～ ${lastDate}</div>
        </div>
      </div>
      <div class="svc-body">
        <div class="mini-kpi">
          <div class="mk"><div class="l">${kpiLabels[0]}</div><div class="v" style="color:${svc.color}">${kpiValues[0]}</div></div>
          <div class="mk"><div class="l">${kpiLabels[1]}</div><div class="v">${kpiValues[1]}</div></div>
          <div class="mk"><div class="l">${kpiLabels[2]}</div><div class="v">${kpiValues[2]}</div></div>

        <div class="summary-box" style="background:${svc.color}08;border-left:4px solid ${svc.color};border-radius:0 8px 8px 0;padding:12px 16px;margin:16px 0">
          <div style="font-size:12px;font-weight:600;color:${svc.color};margin-bottom:4px">重點觀察</div>
          <div style="font-size:14px;line-height:1.7;color:var(--ink)">${svc.summary}</div>
        </div>
        ${detailSection}
      </div>
    </div>`;
  document.getElementById('sections').insertAdjacentHTML('beforeend', html);

  // 護理交班用折線圖，其他用柱狀圖
  new Chart(document.getElementById(chartId), {
    type: isNursing ? 'line' : 'bar',
    data:{
      labels:mKeys,
      datasets:[{
        label:svc.name,
        data:mVals,
        backgroundColor: isNursing ? svc.color+'33' : svc.color,
        borderColor: isNursing ? svc.color : undefined,
        borderWidth: isNursing ? 2 : undefined,
        fill: isNursing,
        tension: isNursing ? 0.3 : undefined,
        borderRadius:4,
        maxBarThickness:50,
      }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{label:c=>fmt(c.raw)+' 次'}}
      },
      scales:{
        y:{beginAtZero:true,ticks:{callback:v=>fmt(v)}},
        x:{ticks:{maxRotation:45,minRotation:45}}
      }
    }
  });
}

function toggleDetail(key){
  const el = document.getElementById('detail-'+key);
  const toggle = el.previousElementSibling;
  if(el.classList.contains('open')){
    el.classList.remove('open');
    toggle.textContent = '▼ 展開每日明細';
  } else {
    el.classList.add('open');
    toggle.textContent = '▲ 收合每日明細';
  }
}

document.getElementById('updated').textContent = '資料更新日期：2026-08-06';
SERVICES.forEach((s,i)=>buildSection(s,i));
</script>
