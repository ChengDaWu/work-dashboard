<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 應用程式使用率統計報告</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#f5f7fa; --card:#ffffff; --ink:#1f2937; --muted:#6b7280;
    --border:#e5e7eb; --accent:#2563eb; --accent2:#10b981;
    --c-er:#6366f1; --c-sheet:#10b981; --c-drug:#f59e0b; --c-quick:#ef4444;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
  .wrap{max-width:1100px;margin:0 auto;padding:32px 24px 64px}
  header{margin-bottom:28px}
  h1{font-size:26px;font-weight:700;letter-spacing:.5px}
  .sub{color:var(--muted);font-size:14px;margin-top:6px}
  .updated{color:var(--muted);font-size:12px;margin-top:4px}

  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow)}
  .kpi .label{font-size:13px;color:var(--muted);font-weight:500}
  .kpi .val{font-size:28px;font-weight:700;margin-top:6px}
  .kpi .bar{height:4px;border-radius:2px;margin-top:10px;background:var(--border)}
  .kpi .bar i{display:block;height:100%;border-radius:2px}

  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:22px 24px;margin-bottom:24px}
  .card h2{font-size:17px;font-weight:600;margin-bottom:4px}
  .card .desc{font-size:13px;color:var(--muted);margin-bottom:18px}
  .chart-box{position:relative;height:340px}
  .chart-box.tall{height:420px}

  .legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;font-size:13px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
  th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--border)}
  th:first-child,td:first-child{text-align:left}
  thead th{background:#f9fafb;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  tbody tr:hover{background:#f9fafb}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}

  .tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .tab{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);transition:.15s}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .tab:hover:not(.active){border-color:var(--accent);color:var(--accent)}

  footer{margin-top:32px;color:var(--muted);font-size:12px;text-align:center}

  @media(max-width:780px){
    .kpi-grid{grid-template-columns:repeat(2,1fr)}
    .chart-box{height:280px}
  }
</style>
</head>
<body>

  <section class="kpi-grid" id="kpis"></section>

    <div class="chart-box"><canvas id="chartTotal"></canvas></div>
  </div>

    <div class="tabs" id="tabs"></div>
    <div class="chart-box tall"><canvas id="chartTrend"></canvas></div>
  </div>

  <div class="card">

    <div class="tabs" id="dtabs"></div>
    <div style="max-height:420px;overflow:auto">
      <table id="dtbl"><thead><tr><th>日期</th><th style="text-align:right">使用次數</th></tr></thead><tbody></tbody></table>
    </div>
  </div>

  <footer>本報告由系統自動產生 · 資料來源：HIS 使用紀錄</footer>
</div>

const fmt = n => n.toLocaleString('zh-TW');
const sum = arr => arr.reduce((s,[,v])=>s+v,0);

// ---- KPI ----
const totals = SERVICES.map(s => ({...s, total: sum(DATA[s.key])}));
const grand = totals.reduce((s,t)=>s+t.total,0);
const kpiBox = document.getElementById('kpis');
totals.forEach(t=>{
  const pct = grand ? (t.total/grand*100) : 0;
  kpiBox.insertAdjacentHTML('beforeend', `
    <div class="kpi">
      <div class="label">${t.name}</div>
      <div class="val" style="color:${t.color}">${fmt(t.total)}</div>
      <div class="bar"><i style="width:${pct.toFixed(1)}%;background:${t.color}"></i></div>
    </div>`);
});

// ---- Total bar chart ----

  type:'bar',
  data:{
    labels: totals.map(t=>t.name),
    datasets:[{

      backgroundColor: totals.map(t=>t.color),
      borderRadius:6, maxBarThickness:80,
    }]
  },
  options:{
    responsive:true, maintainAspectRatio:false,
    plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>fmt(c.raw)+' 次'}}},
    scales:{y:{beginAtZero:true,ticks:{callback:v=>fmt(v)}}}
  }
});

// ---- Monthly aggregation ----
function monthly(arr){
  const m={};
  arr.forEach(([d,v])=>{
    const k=d.slice(0,7); m[k]=(m[k]||0)+v;
  });
  return m;
}
const allMonths = new Set();
SERVICES.forEach(s=>Object.keys(monthly(DATA[s.key])).forEach(k=>allMonths.add(k)));
const months = [...allMonths].sort();
const monthData = {};
SERVICES.forEach(s=>{
  const m = monthly(DATA[s.key]);
  monthData[s.key] = months.map(mk=>m[mk]||0);
});

// ---- Trend chart with tabs ----
let trendChart;
function renderTrend(filter){
  let labels = months, sets;
  if(filter==='all'){
    sets = SERVICES.map(s=>({
      label:s.name, data:monthData[s.key], borderColor:s.color,
      backgroundColor:s.color+'22', fill:true, tension:.3, borderWidth:2, pointRadius:2,
    }));
  } else {
    const s = SERVICES.find(x=>x.key===filter);
    sets = [{
      label:s.name, data:monthData[s.key], borderColor:s.color,
      backgroundColor:s.color+'22', fill:true, tension:.3, borderWidth:2, pointRadius:3,
    }];
  }
  const cfg = {
    type:'line',
    data:{labels, datasets:sets},
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{tooltip:{callbacks:{label:c=>c.dataset.label+': '+fmt(c.raw)+' 次'}}},

    }
  };
  if(trendChart) trendChart.destroy();
  trendChart = new Chart(document.getElementById('chartTrend'), cfg);
}

  b.onclick=()=>{
    [...tabsEl.children].forEach(c=>c.classList.remove('active'));
    b.classList.add('active');
    renderTrend(t.key);
  };
  tabsEl.appendChild(b);
});

// ---- Detail table ----

function renderDetail(key){
  const s = SERVICES.find(x=>x.key===key);

  dtblBody.innerHTML = rows.map(([d,v])=>

}
