<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>健保優化提醒｜8 月數據報告</title>
<style>
:root{
  --ink:#2b2b33;
  --muted:#8a8a94;
  /* 三色：粉藍(主)、粉綠(輔)、粉紅(點綴) */
  --blue:#5b9cf5;
  --blue-deep:#3b7de0;
  --blue-soft:#eaf3fe;
  --green:#3ecf9a;
  --green-deep:#1fb583;
  --green-soft:#e8faf3;
  --pink:#f06ba8;
  --pink-deep:#e14a90;
  --pink-soft:#fdeef5;
  --up:#e14a90;
  --down:#c2410c;
  --flat:#8a8a94;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:#f7f8fa;
  color:var(--ink);
  font-family:Inter,"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

/* ===== 漂浮色暈背景 ===== */
.aura{
  position:fixed;
  border-radius:50%;
  filter:blur(90px);
  opacity:.5;
  pointer-events:none;
  z-index:0;
}
.aura.a1{width:520px;height:520px;background:#cfe4fd;top:-160px;right:-120px}
.aura.a2{width:420px;height:420px;background:#c8f5e4;top:38%;left:-180px}
.aura.a3{width:380px;height:380px;background:#fbd3e6;bottom:-140px;right:22%}

.page{
  position:relative;
  z-index:1;
  width:min(1080px,calc(100% - 48px));
  margin:0 auto;
  padding:48px 0 90px;
}

/* ===== 頁首 ===== */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:56px;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
}
.brand-mark{
  width:40px;height:40px;
  border-radius:14px;
  background:linear-gradient(135deg,#7db4f8,#5b9cf5);
  box-shadow:0 8px 20px rgba(91,156,245,.35);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:900;font-size:16px;
  transform:rotate(-6deg);
}
.brand-name{
  font-size:17px;
  font-weight:800;
  letter-spacing:-.01em;
}
.brand-name small{
  display:block;
  font-size:12.5px;
  color:var(--muted);
  font-weight:600;
  letter-spacing:.04em;
}
.period-badge{
  font-size:14px;
  font-weight:700;
  color:var(--pink-deep);
  background:var(--pink-soft);
  padding:9px 18px;
  border-radius:999px;
  box-shadow:0 4px 12px rgba(240,107,168,.15);
}

/* ===== Hero：大標題 + 漂浮 KPI ===== */
.page-head{
  max-width:640px;
}
.page-head .kicker{
  font-size:15px;
  font-weight:800;
  letter-spacing:.18em;
  color:var(--blue-deep);
  text-transform:uppercase;
}
.page-head h1{
  margin:12px 0 0;
  font-size:clamp(34px,4.6vw,52px);
  line-height:1.12;
  letter-spacing:-.04em;
  font-weight:850;
}
.page-head h1 .hl{
  background:linear-gradient(120deg,#5b9cf5,#3ecf9a);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.page-head .lead{
  margin-top:16px;
  color:var(--muted);
  font-size:17px;
  line-height:1.85;
}

.hero{
  margin-top:44px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}
.hero-card{
  background:#fff;
  border-radius:24px;
  padding:26px 26px 24px;
  box-shadow:0 10px 40px rgba(43,43,51,.06);
  position:relative;
  overflow:hidden;
  transition:transform .25s ease, box-shadow .25s ease;
}
.hero-card:hover{
  transform:translateY(-5px);
  box-shadow:0 20px 50px rgba(43,43,51,.10);
}
.hero-card::after{
  content:"";
  position:absolute;
  width:130px;height:130px;
  border-radius:50%;
  right:-46px;top:-46px;
  opacity:.55;
}
.hero-card.c-blue::after{background:radial-gradient(circle,#cfe4fd,transparent 70%)}
.hero-card.c-pink::after{background:radial-gradient(circle,#fbd3e6,transparent 70%)}
.hero-card.c-green::after{background:radial-gradient(circle,#c8f5e4,transparent 70%)}
.hero-label{
  font-size:15px;
  color:var(--muted);
  font-weight:700;
  letter-spacing:.05em;
}
.hero-value{
  margin-top:12px;
  font-size:48px;
  font-weight:850;
  letter-spacing:-.045em;
  line-height:1;
  font-variant-numeric:tabular-nums;
}
.hero-card.c-blue .hero-value{color:var(--blue-deep)}
.hero-card.c-pink .hero-value{color:var(--pink-deep)}
.hero-card.c-green .hero-value{color:var(--green-deep)}
.hero-sub{
  margin-top:10px;
  font-size:14px;
  color:var(--muted);
}

/* ===== 分組標題：手寫感分隔 ===== */
.group-head{
  margin:72px 0 26px;
  display:flex;
  align-items:baseline;
  gap:14px;
  flex-wrap:wrap;
}
.group-head h2{
  margin:0;
  font-size:27px;
  font-weight:850;
  letter-spacing:-.03em;
}
.group-head .no{
  font-size:15px;
  font-weight:900;
  color:#fff;
  background:linear-gradient(135deg,#7db4f8,#5b9cf5);
  width:30px;height:30px;
  border-radius:10px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  transform:translateY(3px) rotate(-4deg);
  box-shadow:0 6px 14px rgba(91,156,245,.3);
}
.group-head.g2 .no{
  background:linear-gradient(135deg,#f48fbf,#f06ba8);
  box-shadow:0 6px 14px rgba(240,107,168,.3);
}

/* ===== 項目卡：雜誌式大小交錯 ===== */
.aug-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:18px;
}
.aug-card{
  grid-column:span 2;
  background:#fff;
  border-radius:22px;
  padding:24px 24px 20px;
  box-shadow:0 8px 30px rgba(43,43,51,.05);
  display:flex;
  flex-direction:column;
  gap:8px;
  position:relative;
  overflow:hidden;
  transition:transform .22s ease, box-shadow .22s ease;
}
.aug-card:hover{
  transform:translateY(-4px);
  box-shadow:0 16px 44px rgba(43,43,51,.09);
}
/* 每組第一張：該組總表卡（小計 + 迷你分佈圖） */
.aug-card.featured{
  grid-column:span 3;
  grid-row:span 2;
  padding:28px 30px;
  justify-content:flex-start;
  gap:14px;
  min-height:230px;
  color:#fff;
}
.aug-card.featured::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:0;
}
.aug-card.featured.f-blue::before{background:linear-gradient(150deg,#6aa8f7 0%,#4a8bee 55%,#3b7de0 100%)}
.aug-card.featured.f-pink::before{background:linear-gradient(150deg,#f48fbf 0%,#f06ba8 55%,#e14a90 100%)}
.aug-card.featured > *{position:relative;z-index:1}
.f-title{
  font-size:14px;
  font-weight:800;
  letter-spacing:.14em;
  color:rgba(255,255,255,.9);
  text-transform:uppercase;
}
.f-figures{
  display:flex;
  align-items:baseline;
  gap:28px;
  flex-wrap:wrap;
}
.f-fig .f-num{
  font-size:42px;
  font-weight:850;
  letter-spacing:-.04em;
  line-height:1;
  font-variant-numeric:tabular-nums;
}
.f-fig .f-lb{
  margin-top:7px;
  font-size:13.5px;
  color:rgba(255,255,255,.85);
  font-weight:600;
}
.f-fig.hero .f-num{font-size:58px}
.f-chart{
  margin-top:auto;
  display:flex;
  align-items:flex-end;
  gap:8px;
  height:96px;
}
.f-chart .fc{
  flex:1;
  display:grid;
  grid-template-rows:16px 1fr 26px;
  gap:4px;
  height:100%;
  min-width:0;
  align-items:end;
}
.f-chart .fc i{
  display:block;
  width:100%;
  border-radius:5px 5px 3px 3px;
  background:rgba(255,255,255,.32);
  min-height:3px;
  transition:background .18s ease;
  align-self:end;
}
.f-chart .fc:hover i{background:rgba(255,255,255,.75)}
.f-chart .fc .fn{
  font-size:11px;
  text-align:center;
  color:rgba(255,255,255,.85);
  font-weight:700;
  line-height:1.2;
  word-break:break-all;
  display:-webkit-box;
  line-clamp:2;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  align-self:start;
}
.f-chart .fc .fv{
  font-size:12px;
  font-weight:800;
  color:#fff;
  text-align:center;
  line-height:1;
  align-self:start;
  font-variant-numeric:tabular-nums;
}
.aug-card.featured .f-deco{
  position:absolute;
  right:-30px;top:-30px;
  width:150px;height:150px;
  border-radius:50%;
  background:rgba(255,255,255,.14);
  z-index:0;
}
.aug-card.featured .f-deco::after{
  content:"";
  position:absolute;
  right:70px;top:110px;
  width:70px;height:70px;
  border-radius:50%;
  background:rgba(255,255,255,.12);
}

.aug-card h3{
  margin:0;
  font-size:16px;
  font-weight:700;
  line-height:1.5;
  color:#3a3a44;
}
.aug-total{
  font-size:14px;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.aug-total b{color:var(--green-deep);font-weight:700}
.aug-main{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:10px;
  margin-top:2px;
}
.aug-agree{
  font-size:40px;
  font-weight:850;
  letter-spacing:-.04em;
  line-height:1;
  color:var(--blue-deep);
  font-variant-numeric:tabular-nums;
}
.aug-agree small{
  font-size:13px;
  font-weight:600;
  color:var(--muted);
  letter-spacing:0;
  margin-left:6px;
}
.aug-rate{
  flex:none;
  font-size:14px;
  font-weight:800;
  color:var(--pink-deep);
  background:var(--pink-soft);
  padding:6px 13px;
  border-radius:999px;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.bar{
  height:7px;
  border-radius:999px;
  background:#eef0f3;
  overflow:hidden;
  margin-top:8px;
}
.bar i{
  display:block;
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg,#7db4f8,#5b9cf5);
}

/* ===== 趨勢區：大圓角色塊容器 ===== */
.trend-section{
  margin-top:80px;
  background:linear-gradient(160deg,#ffffff 0%,#f2f7fe 100%);
  border-radius:32px;
  padding:36px 36px 30px;
  box-shadow:0 14px 50px rgba(91,156,245,.10);
}
.trend-section h2{
  font-size:22px;
  font-weight:850;
  letter-spacing:-.03em;
  margin:0 0 6px;
}
.trend-note{
  color:var(--muted);
  font-size:13px;
  margin:0 0 26px;
}
.tchart{
  display:grid;
  gap:4px;
}
.trow{
  display:grid;
  grid-template-columns:190px 1fr 84px;
  gap:16px;
  align-items:center;
  padding:12px 14px;
  border-radius:16px;
  transition:background .18s ease;
}
.trow:hover{background:rgba(255,255,255,.85)}
.trow-name{
  font-size:13px;
  font-weight:700;
  color:#4a4a55;
  line-height:1.4;
}
.tdelta{
  text-align:right;
  font-size:13px;
  font-weight:850;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.tdelta small{
  display:block;
  font-size:10px;
  color:var(--muted);
  font-weight:600;
}
.tdelta.up{color:var(--up)}
.tdelta.down{color:var(--down)}
.tdelta.flat{color:var(--flat)}
.trow-bars{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  align-items:end;
  height:76px;
}
.tbar{
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  gap:5px;
  height:100%;
}
.tbar i{
  display:block;
  border-radius:8px 8px 4px 4px;
  background:#d8ecdd;
  min-height:4px;
}
.tbar.aug i{
  background:linear-gradient(180deg,#7db4f8,#4a8bee);
  box-shadow:0 6px 16px rgba(91,156,245,.35);
}
.tbar span{
  font-size:10px;
  text-align:center;
  color:var(--muted);
  font-weight:600;
  font-variant-numeric:tabular-nums;
}
.tbar .v{visibility:hidden}
.trow:hover .tbar .v{visibility:visible}
.tbar.aug .v{visibility:visible;color:var(--blue-deep);font-weight:800}
.tlegend{
  display:flex;
  gap:20px;
  margin-top:22px;
  padding-top:18px;
  border-top:1px dashed #dde3ea;
  font-size:12px;
  color:var(--muted);
}
.tlegend b{color:var(--blue-deep)}

.footer{
  margin-top:56px;
  text-align:center;
  color:#b0b3ba;
  font-size:12px;
  letter-spacing:.05em;
}

@media(max-width:960px){
  .hero{grid-template-columns:1fr}
  .aug-grid{grid-template-columns:repeat(2,1fr)}
  .aug-card,.aug-card.featured{grid-column:span 1;grid-row:auto;min-height:0}
}
@media(max-width:640px){
  .page{width:min(100% - 28px,1080px);padding-top:30px}
  .aug-grid{grid-template-columns:1fr}
  .trow{grid-template-columns:1fr;gap:6px}
  .tdelta{text-align:left}
  .trend-section{padding:24px 18px}
}
</style>
</head>
<body>
<div class="aura a1"></div>
<div class="aura a2"></div>
<div class="aura a3"></div>
<div class="page">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">醫</div>
      <div class="brand-name">健保優化提醒<small>Medical Order Report</small></div>
    </div>
    <div class="period-badge">2026 年 8 月</div>
  </div>

  <div class="page-head">
    <div class="kicker">August Monthly Report</div>
    <h1>8 月份<br><span class="hl">監控數據</span>總覽</h1>
    <p class="lead">12 個提醒項目、13,679 次提醒。本月新增「高風險藥物監控」系列 6 個項目；5–7 月歷史資料於頁尾趨勢圖呈現。</p>
  </div>

  <div class="hero" id="hero"></div>

  <div class="group-head">
    <h2><span class="no">01</span> 健保優化提醒</h2>
  </div>
  <div class="aug-grid" id="augNhi"></div>

  <div class="group-head">
    <h2><span class="no">02</span> 高風險藥物監控</h2>
  </div>
  <div class="aug-grid" id="augDrug"></div>

  <section class="trend-section">
    <h2>5–8 月開立率趨勢</h2>
    <p class="trend-note">僅含 5–7 月已有歷史資料之項目；高風險藥物監控為 8 月新增，無前期資料。深色長條為 8 月。</p>
    <div class="tchart" id="tchart"></div>
    <div class="tlegend">
      <span>粉綠＝5–7 月</span>
      <span><b>粉藍＝8 月</b></span>
    </div>
  </section>

  <div class="footer">健保優化提醒 ・ 2026 年 8 月數據報告</div>
</div>

<script>
// 8 月資料（total = Y + N，agree = Y）
const augNhi = [
  { name:"健保優化提醒：X光",      total:2089, agree:184 },
  { name:"健保優化提醒：心超",      total:2080, agree:133 },
  { name:"健保優化提醒：保險餘額",  total:1299, agree:338 },
  { name:"健保優化提醒：腹超-BC肝", total:140,  agree:10  },
  { name:"健保優化提醒：膽固醇",    total:479,  agree:212 },
  { name:"是否修改慢箋天數為30天",  total:6276, agree:304 }
];

const augDrug = [
  { name:"高風險藥物監控：Blopress plus加強錠",   total:28,  agree:7  },
  { name:"高風險藥物監控：血管張力素受體阻斷劑+雙效", total:50,  agree:5  },
  { name:"高風險藥物監控：利尿劑（保鉀型）",       total:343, agree:77 },
  { name:"高風險藥物監控：利尿劑（Thiazide類）",   total:91,  agree:18 },
  { name:"高風險藥物監控：利尿劑（Loop強效）",     total:548, agree:98 },
  { name:"高風險藥物監控：合成抗利尿激素",         total:207, agree:32 }
];

// 5–7 月歷史資料（僅供頁尾趨勢圖）
const history = [
  { name:"健保優化提醒：X光",      rates:[6.7, 6.7, 11.2], aug: 184/2089*100 },
  { name:"健保優化提醒：心超",      rates:[7.1, 6.8, 7.8],  aug: 133/2080*100 },
  { name:"健保優化提醒：保險餘額",  rates:[23.5,21.4,24.5], aug: 338/1299*100 },
  { name:"健保優化提醒：腹超-BC肝", rates:[100, 100, 91.3], aug: 10/140*100  },
  { name:"健保優化提醒：膽固醇",    rates:[46.6,39.9,40.4], aug: 212/479*100 },
  { name:"是否修改慢箋天數為30天",  rates:[10.6, 7.2, 5.9], aug: 304/6276*100 }
];

const nf = new Intl.NumberFormat("zh-TW");
function pct(v){ return v.toFixed(1) + "%"; }

// ---- Hero KPI（漂浮卡片，右上角色暈） ----
(function renderHero(){
  const all = [...augNhi, ...augDrug];
  const totalAll = all.reduce((s,x)=>s+x.total,0);
  const agreeAll = all.reduce((s,x)=>s+x.agree,0);
  const kpis = [
    { label:"提醒總數", value:nf.format(totalAll), sub:"12 個提醒項目", cls:"c-blue" },
    { label:"開立數",   value:nf.format(agreeAll), sub:"醫師同意並開立", cls:"c-pink" },
    { label:"整體開立率", value:pct(agreeAll/totalAll*100), sub:"開立數 ÷ 提醒總數", cls:"c-green" }
  ];
  const root = document.getElementById("hero");
  kpis.forEach(k=>{
    const el = document.createElement("div");
    el.className = "hero-card " + k.cls;
    el.innerHTML = `
      <div class="hero-label">${k.label}</div>
      <div class="hero-value">${k.value}</div>
      <div class="hero-sub">${k.sub}</div>
    `;
    root.appendChild(el);
  });
})();


// ---- 8 月卡片（每組第一張為該組總表卡） ----
function shortName(name){
  return name.replace(/^健保優化提醒：/,"").replace(/^高風險藥物監控：/,"")
    .replace("血管張力素受體阻斷劑+雙效","ARB+雙效")
    .replace("Blopress plus加強錠","Blopress")
    .replace("是否修改慢箋天數為30天","慢箋30天");
}
function renderAug(list, targetId, featuredCls, groupLabel){
  const root = document.getElementById(targetId);
  const t = list.reduce((s,x)=>s+x.total,0);
  const a = list.reduce((s,x)=>s+x.agree,0);
  const maxAgree = Math.max(...list.map(x=>x.agree),1);

  // 總表卡
  const f = document.createElement("section");
  f.className = "aug-card featured " + featuredCls;
  const bars = list.map(x=>`
    <div class="fc">
      <span class="fv">${nf.format(x.agree)}</span>
      <i style="height:${(x.agree/maxAgree*100).toFixed(1)}%"></i>
      <span class="fn">${shortName(x.name)}</span>
    </div>
  `).join("");
  f.innerHTML = `
    <div class="f-deco"></div>
    <div class="f-title">${groupLabel} ・ 8 月小計</div>
    <div class="f-figures">
      <div class="f-fig hero">
        <div class="f-num">${nf.format(a)}</div>
        <div class="f-lb">開立數</div>
      </div>
      <div class="f-fig">
        <div class="f-num">${nf.format(t)}</div>
        <div class="f-lb">提醒總數</div>
      </div>
      <div class="f-fig">
        <div class="f-num">${pct(a/t*100)}</div>
        <div class="f-lb">開立率</div>
      </div>
    </div>
    <div class="f-chart">${bars}</div>
  `;
  root.appendChild(f);

  // 各項目卡
  list.forEach(item=>{
    const r = item.agree / item.total * 100;
    const el = document.createElement("section");
    el.className = "aug-card";
    el.innerHTML = `
      <h3>${item.name}</h3>
      <div class="aug-total">提醒 <b>${nf.format(item.total)}</b> 件</div>
      <div class="aug-main">
        <div class="aug-agree">${nf.format(item.agree)}<small>開立數</small></div>
        <div class="aug-rate">${pct(r)}</div>
      </div>
      <div class="bar"><i style="width:${r.toFixed(1)}%"></i></div>
    `;
    root.appendChild(el);
  });
}
renderAug(augNhi, "augNhi", "f-blue", "健保優化提醒");
renderAug(augDrug, "augDrug", "f-pink", "高風險藥物監控");

// ---- 5–8 月趨勢圖 ----
const months = ["5月","6月","7月","8月"];
const troot = document.getElementById("tchart");
history.forEach(item=>{
  const all = [...item.rates, item.aug];
  const max = Math.max(...all, 1);
  const bars = all.map((v,i)=>`
    <div class="tbar${i===3?" aug":""}">
      <span class="v">${pct(v)}</span>
      <i style="height:${(v/max*100).toFixed(1)}%"></i>
      <span>${months[i]}</span>
    </div>
  `).join("");
  const diff = item.aug - item.rates[2];
  const dCls = diff > 1 ? "up" : diff < -1 ? "down" : "flat";
  const dSym = diff > 1 ? "▲" : diff < -1 ? "▼" : "―";
  const row = document.createElement("div");
  row.className = "trow";
  row.innerHTML = `
    <div class="trow-name">${item.name}</div>
    <div class="trow-bars">${bars}</div>
    <div class="tdelta ${dCls}">${dSym} ${Math.abs(diff).toFixed(1)}<small>較 7 月</small></div>
  `;
  troot.appendChild(row);
});
</script>
</body>
