<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>健保優化提醒｜8 月數據報告</title>
<style>
:root{
  --bg:#f5fafb;
  --surface:#ffffff;
  --ink:#18333b;
  --muted:#71868d;
  --line:#dce9ed;
  --teal:#2f968d;
  --teal-dark:#267970;
  --blue:#4e8fa8;
  --soft-teal:#eaf6f3;
  --soft-blue:#edf5f8;
  --soft-gray:#f7fafb;
  --down:#9b6a5c;
  --shadow:0 12px 34px rgba(35,75,87,.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:
    radial-gradient(circle at 90% 5%, rgba(79,143,168,.08), transparent 24%),
    linear-gradient(180deg,#fbfdfe 0%,#f4f9fa 100%);
  color:var(--ink);
  font-family:Inter,"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
.page{
  width:min(1120px,calc(100% - 40px));
  margin:0 auto;
  padding:64px 0 88px;
}
.eyebrow{
  font-size:12px;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:var(--teal);
  font-weight:800;
}
h1,h2,p{margin:0}
h1{
  margin-top:10px;
  font-size:clamp(38px,5vw,64px);
  line-height:1.08;
  letter-spacing:-.04em;
}
.lead{
  max-width:820px;
  margin-top:15px;
  color:var(--muted);
  font-size:17px;
  line-height:1.75;
}
.hero{
  margin-top:36px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}
.hero-card{
  background:rgba(255,255,255,.96);
  border:1px solid var(--line);
  border-radius:20px;
  padding:20px 22px;
  box-shadow:var(--shadow);
  position:relative;
  overflow:hidden;
}
.hero-card::before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:4px;
  background:linear-gradient(180deg,var(--teal),var(--blue));
}
.hero-label{
  font-size:12px;
  color:var(--muted);
  font-weight:700;
  letter-spacing:.06em;
}
.hero-value{
  margin-top:8px;
  font-size:34px;
  font-weight:850;
  letter-spacing:-.035em;
  line-height:1;
  font-variant-numeric:tabular-nums;
}
.hero-value em{
  font-style:normal;
  font-size:16px;
  color:var(--muted);
  font-weight:700;
  margin-left:2px;
}
.hero-sub{
  margin-top:8px;
  font-size:12px;
  color:var(--muted);
  line-height:1.5;
}
.group-title{
  margin:52px 0 4px;
  font-size:21px;
  letter-spacing:-.02em;
  display:flex;
  align-items:center;
  gap:12px;
}
.group-title::after{
  content:"";
  flex:1;
  height:1px;
  background:var(--line);
}
.group-tag{
  font-size:11px;
  font-weight:800;
  color:var(--blue);
  background:var(--soft-blue);
  padding:5px 10px;
  border-radius:999px;
  letter-spacing:.06em;
}
.aug-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
  margin-top:20px;
}
.aug-card{
  background:rgba(255,255,255,.96);
  border:1px solid var(--line);
  border-radius:22px;
  padding:24px;
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
  gap:14px;
  transition:transform .18s ease, box-shadow .18s ease;
}
.aug-card:hover{
  transform:translateY(-3px);
  box-shadow:0 18px 44px rgba(35,75,87,.12);
}
.aug-card-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
}
.aug-card h3{
  margin:0;
  font-size:17px;
  line-height:1.4;
  letter-spacing:-.01em;
}
.aug-rate{
  flex:none;
  text-align:right;
  font-size:34px;
  font-weight:850;
  letter-spacing:-.035em;
  line-height:1;
  font-variant-numeric:tabular-nums;
}
.aug-rate small{
  display:block;
  margin-top:5px;
  font-size:10px;
  color:var(--muted);
  font-weight:700;
  letter-spacing:.08em;
}
.rate-hi{color:var(--teal-dark)}
.rate-mid{color:var(--blue)}
.rate-lo{color:var(--down)}
.aug-nums{
  display:flex;
  gap:22px;
  font-size:13px;
  color:var(--muted);
}
.aug-nums strong{
  color:var(--ink);
  font-size:18px;
  font-variant-numeric:tabular-nums;
}
.bar{
  height:10px;
  border-radius:999px;
  background:var(--soft-gray);
  border:1px solid var(--line);
  overflow:hidden;
}
.bar i{
  display:block;
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg,var(--teal),var(--blue));
}
.bar.lo i{background:linear-gradient(90deg,#c08a76,var(--down))}
.trend-section{
  margin-top:64px;
  background:rgba(255,255,255,.96);
  border:1px solid var(--line);
  border-radius:24px;
  padding:28px;
  box-shadow:var(--shadow);
}
.trend-section h2{
  font-size:22px;
  letter-spacing:-.02em;
  margin-bottom:6px;
}
.trend-note{
  color:var(--muted);
  font-size:13px;
  margin-bottom:20px;
}
.tchart{
  display:grid;
  gap:14px;
}
.trow{
  display:grid;
  grid-template-columns:210px 1fr 74px;
  gap:14px;
  align-items:center;
}
.trow-name{
  font-size:13px;
  font-weight:700;
  color:#4e6971;
  line-height:1.4;
}
.tdelta{
  text-align:right;
  font-size:13px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.tdelta small{
  display:block;
  font-size:10px;
  color:var(--muted);
  font-weight:700;
}
.tdelta.up{color:var(--teal-dark)}
.tdelta.down{color:var(--down)}
.tdelta.flat{color:var(--blue)}
.trow-bars{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  align-items:end;
  height:96px;
}
.tbar{
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  gap:5px;
  height:100%;
}
.tbar i{
  display:block;
  border-radius:7px 7px 3px 3px;
  background:var(--soft-teal);
  border:1px solid #cfe6e1;
  min-height:3px;
}
.tbar.aug i{
  background:linear-gradient(180deg,var(--teal),var(--teal-dark));
  border-color:var(--teal-dark);
}
.tbar span{
  font-size:10px;
  text-align:center;
  color:var(--muted);
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.tlegend{
  display:flex;
  gap:18px;
  margin-top:18px;
  padding-top:14px;
  border-top:1px solid var(--line);
  font-size:12px;
  color:var(--muted);
}
.tlegend b{
  color:var(--teal-dark);
}
.raw{
  margin-top:18px;
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
}
.raw-title{
  padding:11px 14px;
  background:#eef6f8;
  color:#4e6971;
  font-size:12px;
  font-weight:800;
  letter-spacing:.05em;
}
table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  font-size:13px;
}
th,td{
  padding:11px 14px;
  border-top:1px solid #edf2f3;
}
th{
  color:#61777e;
  text-align:left;
  background:#fbfdfe;
}
td.num,th.num{
  text-align:right;
  font-variant-numeric:tabular-nums;
}
.footer{
  margin-top:40px;
  text-align:center;
  color:#8ca0a6;
  font-size:12px;
}
@media(max-width:760px){
  .page{width:min(100% - 24px,1120px);padding-top:42px}
  .hero{grid-template-columns:repeat(2,1fr)}
  .aug-grid{grid-template-columns:1fr}
  .trow{grid-template-columns:1fr;gap:6px}
  .tdelta{text-align:left}
  .raw{overflow-x:auto}
  table{min-width:520px}
}
</style>
</head>
<body>
<div class="page">
  <div class="eyebrow">August Report</div>
  <h1>8 月健保優化提醒<br>數據報告</h1>
  <p class="lead"></p>

  <div class="hero" id="hero"></div>

  <h2 class="group-title">健保優化提醒 <span class="group-tag">8 月</span></h2>
  <div class="aug-grid" id="augNhi"></div>

  <h2 class="group-title">高風險藥物監控 <span class="group-tag">8 月新增</span></h2>
  <div class="aug-grid" id="augDrug"></div>

  <section class="trend-section">
    <h2>5–8 月同意率趨勢</h2>
    <p class="trend-note">僅含 5–7 月已有歷史資料之項目；高風險藥物監控為 8 月新增，無前期資料。深色長條為 8 月。</p>
    <div class="tchart" id="tchart"></div>
    <div class="tlegend">
      <span>淺色＝5–7 月</span>
      <span><b>深色＝8 月</b></span>
    </div>
  </section>

  <div class="footer">健保優化提醒｜8 月數據報告（附 5–7 月趨勢）</div>
</div>

<script>
// 8 月資料（total = Y + N，agree = Y）
const augNhi = [
  { name:"健保優化提醒：X光",      total:2089, agree:184 },
  { name:"健保優化提醒：心超",      total:2080, agree:133 },
  { name:"健保優化提醒：保險餘額",  total:1299, agree:338 },
  { name:"健保優化提醒：腹超-BC肝", total:140,  agree:10  },
  { name:"健保優化提醒：膽固醇",    total:479,  agree:212 },
  { name:"是否修改慢箋天數為30天",  total:6276, agree:304 }
];

const augDrug = [
  { name:"高風險藥物監控：Blopress plus加強錠",   total:28,  agree:7  },
  { name:"高風險藥物監控：血管張力素受體阻斷劑+雙效", total:50,  agree:5  },
  { name:"高風險藥物監控：利尿劑（保鉀型）",       total:343, agree:77 },
  { name:"高風險藥物監控：利尿劑（Thiazide類）",   total:91,  agree:18 },
  { name:"高風險藥物監控：利尿劑（Loop強效）",     total:548, agree:98 },
  { name:"高風險藥物監控：合成抗利尿激素",         total:207, agree:32 }
];

// 5–7 月歷史資料（僅供頁尾趨勢圖）
const history = [
  { name:"健保優化提醒：X光",      rates:[6.7, 6.7, 11.2], aug: 184/2089*100 },
  { name:"健保優化提醒：心超",      rates:[7.1, 6.8, 7.8],  aug: 133/2080*100 },
  { name:"健保優化提醒：保險餘額",  rates:[23.5,21.4,24.5], aug: 338/1299*100 },
  { name:"健保優化提醒：腹超-BC肝", rates:[100, 100, 91.3], aug: 10/140*100  },
  { name:"健保優化提醒：膽固醇",    rates:[46.6,39.9,40.4], aug: 212/479*100 },
  { name:"是否修改慢箋天數為30天",  rates:[10.6, 7.2, 5.9], aug: 304/6276*100 }
];

const nf = new Intl.NumberFormat("zh-TW");
function pct(v){ return v.toFixed(1) + "%"; }

// ---- Hero KPI 摘要 ----
(function renderHero(){
  const all = [...augNhi, ...augDrug];
  const totalAll = all.reduce((s,x)=>s+x.total,0);
  const agreeAll = all.reduce((s,x)=>s+x.agree,0);
  const kpis = [
    { label:"8 月提醒總數", value:nf.format(totalAll), sub:"涵蓋 12 個提醒項目" },
    { label:"8 月同意總數", value:nf.format(agreeAll), sub:"醫師接受提醒之件數" },
    { label:"整體同意率",   value:pct(agreeAll/totalAll*100), sub:"全部項目加權平均" },
    { label:"高風險藥物監控", value:"6", unit:"項", sub:"8 月新增之監控項目" }
  ];
  const root = document.getElementById("hero");
  kpis.forEach(k=>{
    const el = document.createElement("div");
    el.className = "hero-card";
    el.innerHTML = `
      <div class="hero-label">${k.label}</div>
      <div class="hero-value">${k.value}${k.unit?`<em>${k.unit}</em>`:""}</div>
      <div class="hero-sub">${k.sub}</div>
    `;
    root.appendChild(el);
  });
})();

// ---- 8 月卡片 ----
function rateTier(r){
  if(r >= 20) return "rate-hi";
  if(r >= 10) return "rate-mid";
  return "rate-lo";
}
function renderAug(list, targetId){
  const root = document.getElementById(targetId);
  list.forEach(item=>{
    const r = item.agree / item.total * 100;
    const tier = rateTier(r);
    const el = document.createElement("section");
    el.className = "aug-card";
    el.innerHTML = `
      <div class="aug-card-head">
        <h3>${item.name}</h3>
        <div class="aug-rate ${tier}">${pct(r)}<small>同意率</small></div>
      </div>
      <div class="bar${tier==="rate-lo"?" lo":""}"><i style="width:${r.toFixed(1)}%"></i></div>
      <div class="aug-nums">
        <span>提醒總數 <strong>${nf.format(item.total)}</strong></span>
        <span>同意數 <strong>${nf.format(item.agree)}</strong></span>
      </div>
    `;
    root.appendChild(el);
  });
}
renderAug(augNhi, "augNhi");
renderAug(augDrug, "augDrug");

// ---- 5–8 月趨勢圖 ----
const months = ["5月","6月","7月","8月"];
const troot = document.getElementById("tchart");
history.forEach(item=>{
  const all = [...item.rates, item.aug];
  const max = Math.max(...all, 1);
  const bars = all.map((v,i)=>`
    <div class="tbar${i===3?" aug":""}">
      <span>${pct(v)}</span>
      <i style="height:${(v/max*100).toFixed(1)}%"></i>
      <span>${months[i]}</span>
    </div>
  `).join("");
  const diff = item.aug - item.rates[2];
  const dCls = diff > 1 ? "up" : diff < -1 ? "down" : "flat";
  const dSym = diff > 1 ? "▲" : diff < -1 ? "▼" : "―";
  const row = document.createElement("div");
  row.className = "trow";
  row.innerHTML = `
    <div class="trow-name">${item.name}</div>
    <div class="trow-bars">${bars}</div>
    <div class="tdelta ${dCls}">${dSym} ${Math.abs(diff).toFixed(1)}<small>較 7 月</small></div>
  `;
  troot.appendChild(row);
});
</script>
</body>
</html>
