<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>健保優化提醒｜8 月數據報告</title>
<style>
:root{
  --bg:#ffffff;
  --surface:#ffffff;
  --ink:#1f2937;
  --muted:#6b7280;
  --line:#e5e7eb;
  --line-soft:#f3f4f6;
  /* 粉藍：開立數、品牌、8 月長條（原粉紅職責） */
  --pink:#60a5fa;
  --pink-deep:#3b82f6;
  --pink-soft:#eff6ff;
  --pink-border:#bfdbfe;
  /* 粉綠：提醒總數、歷史長條（原粉藍職責） */
  --blue:#34d399;
  --blue-deep:#10b981;
  --blue-soft:#ecfdf5;
  --blue-border:#a7f3d0;
  /* 粉紅：輔助指標、上升、徽章（原粉綠職責） */
  --green:#ec4899;
  --green-deep:#db2777;
  --green-soft:#fdf2f8;
  --green-border:#fbcfe8;
  --up:#db2777;
  --down:#dc2626;
  --flat:#6b7280;
  --shadow:0 1px 3px rgba(0,0,0,.04);
  --shadow-hover:0 8px 24px rgba(96,165,250,.10);
  --grad-pink:linear-gradient(135deg,#93c5fd 0%,#60a5fa 100%);
  --grad-blue:linear-gradient(135deg,#6ee7b7 0%,#34d399 100%);
  --grad-green:linear-gradient(135deg,#f472b6 0%,#ec4899 100%);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:
    radial-gradient(circle at 15% 8%, rgba(52,211,153,.06), transparent 28%),
    radial-gradient(circle at 85% 4%, rgba(96,165,250,.06), transparent 28%),
    radial-gradient(circle at 50% 100%, rgba(236,72,153,.05), transparent 32%),
    var(--bg);
  color:var(--ink);
  font-family:Inter,"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.page{
  width:min(1200px,calc(100% - 48px));
  margin:0 auto;
  padding:40px 0 80px;
}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  padding-bottom:24px;
  border-bottom:1px solid var(--line);
  margin-bottom:28px;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
}
.brand-mark{
  width:36px;height:36px;
  border-radius:10px;
  background:var(--grad-pink);
  box-shadow:0 4px 14px rgba(96,165,250,.30);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:900;font-size:15px;
}
.brand-name{
  font-size:15px;
  font-weight:800;
  letter-spacing:-.01em;
}
.brand-name small{
  display:block;
  font-size:11px;
  color:var(--muted);
  font-weight:600;
}
.period-badge{
  font-size:12px;
  font-weight:700;
  color:var(--green-deep);
  background:var(--green-soft);
  border:1px solid var(--green-border);
  padding:6px 12px;
  border-radius:999px;
}
h1,h2,p{margin:0}
.page-head h1{
  font-size:clamp(26px,3.4vw,36px);
  line-height:1.15;
  letter-spacing:-.03em;
  font-weight:800;
}
.page-head .lead{
  margin-top:8px;
  color:var(--muted);
  font-size:14px;
  line-height:1.7;
  max-width:760px;
}
.hero{
  margin-top:32px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}
.hero-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px 20px;
  box-shadow:var(--shadow);
  display:flex;
  align-items:center;
  gap:14px;
}
.hero-label{
  font-size:12px;
  color:var(--muted);
  font-weight:600;
}
.hero-value{
  font-size:24px;
  font-weight:800;
  letter-spacing:-.02em;
  line-height:1.1;
  font-variant-numeric:tabular-nums;
}
.hero-value em{
  font-style:normal;
  font-size:13px;
  color:var(--muted);
  font-weight:700;
  margin-left:3px;
}
.hero-ico{
  flex:none;
  width:38px;height:38px;
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:17px;
}
.hero-ico.pink{background:var(--pink-soft);color:var(--pink-deep)}
.hero-ico.blue{background:var(--blue-soft);color:var(--blue-deep)}
.hero-ico.green{background:var(--green-soft);color:var(--green-deep)}
.group-title{
  margin:48px 0 4px;
  font-size:17px;
  font-weight:800;
  letter-spacing:-.01em;
  display:flex;
  align-items:center;
  gap:10px;
}
.group-tag{
  font-size:11px;
  font-weight:700;
  color:var(--green-deep);
  background:var(--green-soft);
  border:1px solid var(--green-border);
  padding:3px 9px;
  border-radius:999px;
  letter-spacing:.02em;
}
.group-summary{
  margin-top:14px;
  padding:12px 16px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  font-size:13px;
  color:var(--muted);
  display:flex;
  gap:24px;
  flex-wrap:wrap;
}
.group-summary b{
  color:var(--ink);
  font-weight:800;
  font-variant-numeric:tabular-nums;
}
.group-summary .pk{color:var(--pink-deep)}
.aug-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-top:14px;
}
.aug-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px 20px 16px;
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
  gap:10px;
  transition:box-shadow .18s ease, border-color .18s ease;
}
.aug-card:hover{
  border-color:var(--pink-border);
  box-shadow:var(--shadow-hover);
}
.aug-card h3{
  margin:0;
  font-size:13px;
  font-weight:700;
  line-height:1.45;
  color:#374151;
  min-height:2.9em;
}
.aug-total{
  font-size:12px;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.aug-total b{
  color:var(--blue-deep);
  font-weight:700;
}
.aug-main{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:10px;
}
.aug-agree{
  font-size:30px;
  font-weight:800;
  letter-spacing:-.03em;
  line-height:1;
  color:var(--pink-deep);
  font-variant-numeric:tabular-nums;
}
.aug-agree small{
  font-size:11px;
  font-weight:600;
  color:var(--muted);
  letter-spacing:0;
  margin-left:5px;
}
.aug-rate{
  flex:none;
  font-size:11px;
  font-weight:700;
  color:var(--green-deep);
  background:var(--green-soft);
  border:1px solid var(--green-border);
  padding:3px 8px;
  border-radius:999px;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.bar{
  height:5px;
  border-radius:999px;
  background:var(--line-soft);
  overflow:hidden;
}
.bar i{
  display:block;
  height:100%;
  border-radius:999px;
  background:var(--grad-pink);
}
.trend-section{
  margin-top:48px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:24px;
  box-shadow:var(--shadow);
}
.trend-section h2{
  font-size:16px;
  font-weight:800;
  letter-spacing:-.01em;
  margin:0 0 4px;
}
.trend-note{
  color:var(--muted);
  font-size:12.5px;
  margin:0 0 18px;
}
.tchart{
  display:grid;
  gap:6px;
}
.trow{
  display:grid;
  grid-template-columns:200px 1fr 86px;
  gap:14px;
  align-items:center;
  padding:10px 8px;
  border-radius:10px;
  transition:background .15s ease;
}
.trow:hover{background:var(--blue-soft)}
.trow-name{
  font-size:13px;
  font-weight:600;
  color:#374151;
  line-height:1.4;
}
.tdelta{
  text-align:right;
  font-size:12px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.tdelta small{
  display:block;
  font-size:10px;
  color:var(--muted);
  font-weight:600;
}
.tdelta.up{color:var(--up)}
.tdelta.down{color:var(--down)}
.tdelta.flat{color:var(--flat)}
.trow-bars{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  align-items:end;
  height:72px;
}
.tbar{
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  gap:4px;
  height:100%;
}
.tbar i{
  display:block;
  border-radius:5px 5px 2px 2px;
  background:var(--blue-soft);
  border:1px solid var(--blue-border);
  min-height:3px;
}
.tbar.aug i{
  background:var(--grad-pink);
  border-color:var(--pink-deep);
  box-shadow:0 3px 10px rgba(96,165,250,.25);
}
.tbar span{
  font-size:10px;
  text-align:center;
  color:var(--muted);
  font-weight:600;
  font-variant-numeric:tabular-nums;
}
.tbar .v{visibility:hidden}
.trow:hover .tbar .v{visibility:visible}
.tbar.aug .v{visibility:visible;color:var(--pink-deep);font-weight:800}
.tlegend{
  display:flex;
  gap:18px;
  margin-top:16px;
  padding-top:14px;
  border-top:1px solid var(--line-soft);
  font-size:12px;
  color:var(--muted);
}
.tlegend b{color:var(--pink-deep)}
.footer{
  margin-top:44px;
  text-align:center;
  color:#9ca3af;
  font-size:12px;
}
@media(max-width:960px){
  .hero{grid-template-columns:1fr}
  .aug-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:640px){
  .page{width:min(100% - 28px,1200px);padding-top:28px}
  .aug-grid{grid-template-columns:1fr}
  .trow{grid-template-columns:1fr;gap:6px}
  .tdelta{text-align:left}
}
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">醫</div>
      <div class="brand-name">健保優化提醒<small>Medical Order Dashboard</small></div>
    </div>
    <div class="period-badge">2026 年 8 月</div>
  </div>

  <div class="page-head">
    <h1>8 月數據總覽</h1>
    <p class="lead">以提醒總數與開立數（同意數）為主要指標，同意率為輔助參考。本月新增「高風險藥物監控」系列 6 個項目；5–7 月歷史資料於頁尾趨勢圖呈現。</p>
  </div>

  <div class="hero" id="hero"></div>

  <h2 class="group-title">健保優化提醒 <span class="group-tag">6 個項目</span></h2>
  <div class="group-summary" id="sumNhi"></div>
  <div class="aug-grid" id="augNhi"></div>

  <h2 class="group-title">高風險藥物監控 <span class="group-tag">8 月新增</span></h2>
  <div class="group-summary" id="sumDrug"></div>
  <div class="aug-grid" id="augDrug"></div>

  <section class="trend-section">
    <h2>5–8 月開立率趨勢</h2>
    <p class="trend-note">僅含 5–7 月已有歷史資料之項目；高風險藥物監控為 8 月新增，無前期資料。深色長條為 8 月。</p>
    <div class="tchart" id="tchart"></div>
    <div class="tlegend">
      <span>粉綠＝5–7 月</span>
      <span><b>粉藍＝8 月</b></span>
    </div>
  </section>

  <div class="footer">健保優化提醒｜8 月數據報告（附 5–7 月趨勢）</div>
</div>

<script>
// 8 月資料（total = Y + N，agree = Y）
const augNhi = [
  { name:"健保優化提醒：X光",      total:2089, agree:184 },
  { name:"健保優化提醒：心超",      total:2080, agree:133 },
  { name:"健保優化提醒：保險餘額",  total:1299, agree:338 },
  { name:"健保優化提醒：腹超-BC肝", total:140,  agree:10  },
  { name:"健保優化提醒：膽固醇",    total:479,  agree:212 },
  { name:"是否修改慢箋天數為30天",  total:6276, agree:304 }
];

const augDrug = [
  { name:"高風險藥物監控：Blopress plus加強錠",   total:28,  agree:7  },
  { name:"高風險藥物監控：血管張力素受體阻斷劑+雙效", total:50,  agree:5  },
  { name:"高風險藥物監控：利尿劑（保鉀型）",       total:343, agree:77 },
  { name:"高風險藥物監控：利尿劑（Thiazide類）",   total:91,  agree:18 },
  { name:"高風險藥物監控：利尿劑（Loop強效）",     total:548, agree:98 },
  { name:"高風險藥物監控：合成抗利尿激素",         total:207, agree:32 }
];

// 5–7 月歷史資料（僅供頁尾趨勢圖）
const history = [
  { name:"健保優化提醒：X光",      rates:[6.7, 6.7, 11.2], aug: 184/2089*100 },
  { name:"健保優化提醒：心超",      rates:[7.1, 6.8, 7.8],  aug: 133/2080*100 },
  { name:"健保優化提醒：保險餘額",  rates:[23.5,21.4,24.5], aug: 338/1299*100 },
  { name:"健保優化提醒：腹超-BC肝", rates:[100, 100, 91.3], aug: 10/140*100  },
  { name:"健保優化提醒：膽固醇",    rates:[46.6,39.9,40.4], aug: 212/479*100 },
  { name:"是否修改慢箋天數為30天",  rates:[10.6, 7.2, 5.9], aug: 304/6276*100 }
];

const nf = new Intl.NumberFormat("zh-TW");
function pct(v){ return v.toFixed(1) + "%"; }

// ---- Hero KPI 摘要（收斂為 3 張，橫向輕量排列） ----
(function renderHero(){
  const all = [...augNhi, ...augDrug];
  const totalAll = all.reduce((s,x)=>s+x.total,0);
  const agreeAll = all.reduce((s,x)=>s+x.agree,0);
  const kpis = [
    { label:"8 月提醒總數", value:nf.format(totalAll), ico:"📋", cls:"blue" },
    { label:"8 月開立數",   value:nf.format(agreeAll), ico:"✅", cls:"pink" },
    { label:"整體開立率",   value:pct(agreeAll/totalAll*100), ico:"📈", cls:"green" }
  ];
  const root = document.getElementById("hero");
  kpis.forEach(k=>{
    const el = document.createElement("div");
    el.className = "hero-card";
    el.innerHTML = `
      <div class="hero-ico ${k.cls}">${k.ico}</div>
      <div>
        <div class="hero-label">${k.label}</div>
        <div class="hero-value">${k.value}</div>
      </div>
    `;
    root.appendChild(el);
  });
})();

// ---- 分組小計 ----
function renderSummary(list, targetId){
  const t = list.reduce((s,x)=>s+x.total,0);
  const a = list.reduce((s,x)=>s+x.agree,0);
  document.getElementById(targetId).innerHTML =
    `小計　提醒 <b>${nf.format(t)}</b> 件　・　開立 <b class="pk">${nf.format(a)}</b> 件　・　開立率 <b>${pct(a/t*100)}</b>`;
}
renderSummary(augNhi, "sumNhi");
renderSummary(augDrug, "sumDrug");

// ---- 8 月卡片（開立數為唯一主角） ----
function renderAug(list, targetId){
  const root = document.getElementById(targetId);
  list.forEach(item=>{
    const r = item.agree / item.total * 100;
    const el = document.createElement("section");
    el.className = "aug-card";
    el.innerHTML = `
      <h3>${item.name}</h3>
      <div class="aug-total">提醒 <b>${nf.format(item.total)}</b> 件</div>
      <div class="aug-main">
        <div class="aug-agree">${nf.format(item.agree)}<small>開立數</small></div>
        <div class="aug-rate">${pct(r)}</div>
      </div>
      <div class="bar"><i style="width:${r.toFixed(1)}%"></i></div>
    `;
    root.appendChild(el);
  });
}
renderAug(augNhi, "augNhi");
renderAug(augDrug, "augDrug");

// ---- 5–8 月趨勢圖 ----
const months = ["5月","6月","7月","8月"];
const troot = document.getElementById("tchart");
history.forEach(item=>{
  const all = [...item.rates, item.aug];
  const max = Math.max(...all, 1);
  const bars = all.map((v,i)=>`
    <div class="tbar${i===3?" aug":""}">
      <span class="v">${pct(v)}</span>
      <i style="height:${(v/max*100).toFixed(1)}%"></i>
      <span>${months[i]}</span>
    </div>
  `).join("");
  const diff = item.aug - item.rates[2];
  const dCls = diff > 1 ? "up" : diff < -1 ? "down" : "flat";
  const dSym = diff > 1 ? "▲" : diff < -1 ? "▼" : "―";
  const row = document.createElement("div");
  row.className = "trow";
  row.innerHTML = `
    <div class="trow-name">${item.name}</div>
    <div class="trow-bars">${bars}</div>
    <div class="tdelta ${dCls}">${dSym} ${Math.abs(diff).toFixed(1)}<small>較 7 月</small></div>
  `;
  troot.appendChild(row);
});
</script>
</body>
</html>
