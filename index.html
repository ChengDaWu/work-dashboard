<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>健保優化提醒｜5–7 月各項目趨勢</title>
<style>
:root{
  --bg:#f5fafb;
  --surface:#ffffff;
  --ink:#18333b;
  --muted:#71868d;
  --line:#dce9ed;
  --teal:#2f968d;
  --teal-dark:#267970;
  --blue:#4e8fa8;
  --soft-teal:#eaf6f3;
  --soft-blue:#edf5f8;
  --soft-gray:#f7fafb;
  --down:#9b6a5c;
  --shadow:0 12px 34px rgba(35,75,87,.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:
    radial-gradient(circle at 90% 5%, rgba(79,143,168,.08), transparent 24%),
    linear-gradient(180deg,#fbfdfe 0%,#f4f9fa 100%);
  color:var(--ink);
  font-family:Inter,"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
.page{
  width:min(1120px,calc(100% - 40px));
  margin:0 auto;
  padding:64px 0 88px;
}
.eyebrow{
  font-size:12px;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:var(--teal);
  font-weight:800;
}
h1,h2,p{margin:0}
h1{
  margin-top:10px;
  font-size:clamp(38px,5vw,64px);
  line-height:1.08;
  letter-spacing:-.04em;
}
.lead{
  max-width:820px;
  margin-top:15px;
  color:var(--muted);
  font-size:17px;
  line-height:1.75;
}
.items{
  display:grid;
  gap:24px;
  margin-top:44px;
}
.item{
  background:rgba(255,255,255,.96);
  border:1px solid var(--line);
  border-radius:24px;
  padding:28px;
  box-shadow:var(--shadow);
}
.item-head{
  display:flex;
  justify-content:space-between;
  gap:18px;
  align-items:flex-start;
  margin-bottom:22px;
}
.item h2{
  font-size:25px;
  line-height:1.3;
  letter-spacing:-.02em;
}
.badge{
  flex:none;
  font-size:12px;
  font-weight:800;
  color:var(--teal-dark);
  background:var(--soft-teal);
  padding:7px 10px;
  border-radius:999px;
}
.months{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}
.month{
  background:var(--soft-gray);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px 18px 16px;
}
.month-label{
  font-size:13px;
  color:var(--muted);
  font-weight:700;
  margin-bottom:12px;
}
.total{
  font-size:32px;
  line-height:1;
  font-weight:850;
  letter-spacing:-.035em;
}
.total-label{
  margin-top:6px;
  font-size:11px;
  color:var(--muted);
}
.month-bottom{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:flex-end;
  margin-top:18px;
  padding-top:14px;
  border-top:1px solid var(--line);
}
.agree{
  font-size:13px;
  color:var(--muted);
  line-height:1.45;
}
.agree strong{
  display:block;
  color:var(--ink);
  font-size:16px;
}
.rate{
  text-align:right;
  color:var(--teal-dark);
  font-size:22px;
  font-weight:850;
  letter-spacing:-.03em;
}
.rate small{
  display:block;
  margin-top:3px;
  font-size:10px;
  color:var(--muted);
  font-weight:700;
  letter-spacing:0;
}
.trend{
  margin-top:18px;
  padding:16px 18px;
  border-radius:16px;
  background:var(--soft-blue);
  display:grid;
  grid-template-columns:120px 1fr;
  gap:16px;
  align-items:center;
}
.trend-label{
  font-size:12px;
  color:var(--blue);
  font-weight:800;
  letter-spacing:.08em;
}
.trend-values{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
  font-size:20px;
  font-weight:800;
}
.arrow{
  color:#99adb3;
  font-size:17px;
  font-weight:600;
}
.up{color:var(--teal-dark)}
.down{color:var(--down)}
.flat{color:var(--blue)}
.insight{
  margin-top:16px;
  padding:16px 18px;
  border-left:4px solid var(--teal);
  background:#f3faf8;
  border-radius:0 14px 14px 0;
}
.insight-title{
  font-size:12px;
  font-weight:800;
  color:var(--teal-dark);
  letter-spacing:.08em;
  margin-bottom:5px;
}
.insight p{
  font-size:14px;
  line-height:1.75;
  color:#5f777e;
}
.raw{
  margin-top:18px;
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
}
.raw-title{
  padding:11px 14px;
  background:#eef6f8;
  color:#4e6971;
  font-size:12px;
  font-weight:800;
  letter-spacing:.05em;
}
table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  font-size:13px;
}
th,td{
  padding:11px 14px;
  border-top:1px solid #edf2f3;
}
th{
  color:#61777e;
  text-align:left;
  background:#fbfdfe;
}
td.num,th.num{
  text-align:right;
  font-variant-numeric:tabular-nums;
}
.footer{
  margin-top:40px;
  text-align:center;
  color:#8ca0a6;
  font-size:12px;
}
@media(max-width:760px){
  .page{width:min(100% - 24px,1120px);padding-top:42px}
  .item{padding:22px}
  .months{grid-template-columns:1fr}
  .trend{grid-template-columns:1fr;gap:8px}
  .raw{overflow-x:auto}
  table{min-width:520px}
}
</style>
</head>
<body>
<div class="page">
  <div class="eyebrow">May–July Trend Review</div>
  <h1>各提醒項目<br>3 個月趨勢</h1>
  <p class="lead">每個項目獨立呈現 5–7 月原始數據與同意率變化，不使用傳統曲線圖或長條圖，改以數字卡與方向指標直接閱讀趨勢。</p>

  <main class="items" id="items"></main>

  <div class="footer">健保優化提醒｜5–7 月各項目趨勢</div>
</div>

<script>
const data = [
  {
    name:"健保優化提醒：X光",
    rows:[
      {m:"5月",total:2261,agree:152},
      {m:"6月",total:2402,agree:162},
      {m:"7月",total:2520,agree:281}
    ],
    summary:"提醒量逐月小幅增加，7 月同意數明顯提升，同意率由約 6.7% 上升至 11.2%。整體呈現量體穩定成長、7 月轉換改善。"
  },
  {
    name:"健保優化提醒：心超",
    rows:[
      {m:"5月",total:1410,agree:100},
      {m:"6月",total:1725,agree:118},
      {m:"7月",total:2260,agree:176}
    ],
    summary:"提醒量連續成長，7 月達 2,260 次；同意率大致維持在 7% 左右，7 月略升至 7.8%。屬於量體增加、轉換率相對穩定。"
  },
  {
    name:"健保優化提醒：保險餘額",
    rows:[
      {m:"5月",total:1681,agree:395},
      {m:"6月",total:1512,agree:324},
      {m:"7月",total:1481,agree:363}
    ],
    summary:"提醒量連續小幅下降，但同意率在 7 月回升至 24.5%。整體量體略減，但轉換表現維持穩定。"
  },
  {
    name:"健保優化提醒：腹超-BC肝",
    rows:[
      {m:"5月",total:98,agree:98},
      {m:"6月",total:104,agree:104},
      {m:"7月",total:149,agree:136}
    ],
    summary:"提醒量逐月增加，5、6 月同意率皆為 100%，7 月仍維持 91.3%。整體表現穩定，但提醒量相對較小。"
  },
  {
    name:"健保優化提醒：膽固醇",
    rows:[
      {m:"5月",total:671,agree:313},
      {m:"6月",total:592,agree:236},
      {m:"7月",total:678,agree:274}
    ],
    summary:"提醒量在 6 月下降、7 月回升；同意率由 46.6% 降至約 40%，之後維持相近水準。整體量體持平，但轉換率較 5 月略低。"
  },
  {
    name:"是否修改慢箋天數為30天",
    rows:[
      {m:"5月",total:3317,agree:351},
      {m:"6月",total:2777,agree:201},
      {m:"7月",total:7148,agree:425}
    ],
    summary:"5 月同意率約 10.6%，6 月降至 7.2%，7 月再降至 5.9%。雖然 7 月提醒量大幅增加，但同意率呈逐月下降。"
  }
];

const nf = new Intl.NumberFormat("zh-TW");

function rate(r){ return r.agree / r.total * 100; }
function pct(v){ return v.toFixed(1) + "%"; }

function trendClass(rates){
  const diff = rates[rates.length-1] - rates[0];
  if(diff > 1) return "up";
  if(diff < -1) return "down";
  return "flat";
}
function trendSymbol(rates){
  const diff = rates[rates.length-1] - rates[0];
  if(diff > 1) return "↑";
  if(diff < -1) return "↓";
  return "→";
}

const root = document.getElementById("items");

data.forEach(item=>{
  const rates = item.rows.map(rate);
  const cls = trendClass(rates);
  const symbol = trendSymbol(rates);

  const el = document.createElement("section");
  el.className = "item";

  const monthCards = item.rows.map((r,i)=>`
    <div class="month">
      <div class="month-label">${r.m}</div>
      <div class="total">${nf.format(r.total)}</div>
      <div class="total-label">提醒總數</div>
      <div class="month-bottom">
        <div class="agree">
          同意數
          <strong>${nf.format(r.agree)}</strong>
        </div>
        <div class="rate">
          ${pct(rates[i])}
          <small>同意率</small>
        </div>
      </div>
    </div>
  `).join("");

  const rawRows = item.rows.map((r,i)=>`
    <tr>
      <td>${r.m}</td>
      <td class="num">${nf.format(r.total)}</td>
      <td class="num">${nf.format(r.agree)}</td>
      <td class="num">${pct(rates[i])}</td>
    </tr>
  `).join("");

  el.innerHTML = `
    <div class="item-head">
      <h2>${item.name}</h2>
      <div class="badge">獨立趨勢</div>
    </div>

    <div class="months">${monthCards}</div>

    <div class="trend">
      <div class="trend-label">同意率變化</div>
      <div class="trend-values ${cls}">
        <span>${pct(rates[0])}</span>
        <span class="arrow">→</span>
        <span>${pct(rates[1])}</span>
        <span class="arrow">→</span>
        <span>${pct(rates[2])}</span>
        <span>${symbol}</span>
      </div>
    </div>

    <div class="insight">
      <div class="insight-title">趨勢判讀</div>
      <p>${item.summary}</p>
    </div>

    <div class="raw">
      <div class="raw-title">原始數據</div>
      <table>
        <thead>
          <tr>
            <th>月份</th>
            <th class="num">提醒總數</th>
            <th class="num">同意數</th>
            <th class="num">同意率</th>
          </tr>
        </thead>
        <tbody>${rawRows}</tbody>
      </table>
    </div>
  `;

  root.appendChild(el);
});
</script>
</body>
</html>
