<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>健保優化提醒月報｜2026 年 9 月</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f7;
  --surface:#ffffff;
  --ink:#1c2b33;
  --muted:#5f6e78;
  --faint:#8e9ba3;
  --rule:#e1e6e9;
  --track:#edf1f4;
  --accent:#1d5fa6;
  --up:#1e7d4f;
  --down:#b83a2e;
  --row-hover:#f7f9fa;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12181c;
    --surface:#1a2227;
    --ink:#e6ecef;
    --muted:#9aa8b0;
    --faint:#6f7d86;
    --rule:#2a353c;
    --track:#25313a;
    --accent:#6fa8e8;
    --up:#5bc08a;
    --down:#e8796c;
    --row-hover:#1f292f;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums}
.page{
  width:min(1040px, calc(100% - 40px));
  margin:0 auto;
  padding:40px 0 64px;
}

/* ===== 頁首 ===== */
.masthead{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:20px;
  flex-wrap:wrap;
  padding-bottom:20px;
  border-bottom:2px solid var(--ink);
}
.masthead h1{
  margin:0;
  font-size:26px;
  font-weight:700;
  letter-spacing:.02em;
}
.masthead .period{
  margin:4px 0 0;
  color:var(--muted);
  font-size:15px;
}
.month-switch{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:13px;
  color:var(--muted);
}
.seg{
  display:inline-flex;
  border:1px solid var(--rule);
  border-radius:8px;
  background:var(--surface);
  padding:3px;
}
.seg button{
  font:inherit;
  font-size:14px;
  color:var(--muted);
  background:none;
  border:0;
  border-radius:6px;
  padding:5px 14px;
  cursor:pointer;
}
.seg button[aria-pressed="true"]{
  background:var(--accent);
  color:#fff;
  font-weight:700;
}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ===== 本月摘要 ===== */
.headline{
  margin:28px 0 20px;
  font-size:19px;
  font-weight:500;
  line-height:1.7;
  max-width:46em;
}
.headline strong{font-weight:700}
.stats{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  margin:0;
  background:var(--surface);
  border:1px solid var(--rule);
  border-radius:12px;
}
.stat{
  padding:16px 20px;
  border-left:1px solid var(--rule);
}
.stat:first-child{border-left:0}
.stat dt{font-size:13px;color:var(--muted)}
.stat dd{margin:0}
.stat .value{
  display:block;
  margin-top:2px;
  font-size:26px;
  font-weight:700;
  line-height:1.3;
}
.stat .change{display:block;margin-top:2px;font-size:13px;color:var(--muted)}

/* ===== 群組表格 ===== */
.group{margin-top:40px}
.group-head{
  display:flex;
  align-items:baseline;
  gap:10px;
  margin-bottom:10px;
}
.group-head h2{margin:0;font-size:18px;font-weight:700}
.group-head .meta{font-size:13px;color:var(--muted)}
.table-wrap{
  background:var(--surface);
  border:1px solid var(--rule);
  border-radius:12px;
  overflow-x:auto;
}
table{
  width:100%;
  min-width:780px;
  border-collapse:collapse;
  table-layout:fixed;
}
th,td{
  padding:11px 16px;
  text-align:right;
  white-space:nowrap;
  vertical-align:middle;
}
th:first-child,td:first-child{
  text-align:left;
  position:sticky;
  left:0;
  z-index:1;
  background:var(--surface);
}
thead th{
  font-size:13px;
  font-weight:500;
  color:var(--muted);
  border-bottom:1px solid var(--rule);
  background:var(--surface);
}
tbody td{border-bottom:1px solid var(--rule)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--row-hover)}
tfoot td{
  font-weight:700;
  border-top:2px solid var(--rule);
  background:var(--surface);
}
td.name{font-weight:500;white-space:normal;min-width:200px}
td.name .small-n{margin-left:4px;color:var(--faint);font-weight:400;cursor:help}
.muted{color:var(--faint)}

/* 開立率：數字＋固定比例長條（0–100%） */
.rate{display:inline-flex;align-items:center;gap:10px}
.rate .v{width:52px;text-align:right;font-weight:700}
.rate .track{
  width:120px;
  height:8px;
  border-radius:4px;
  background:var(--track);
  overflow:hidden;
}
.rate .track i{display:block;height:100%;background:var(--accent);border-radius:4px}
.delta.up{color:var(--up)}
.delta.down{color:var(--down)}
.delta.flat,.delta.none{color:var(--faint)}
.spark{display:block;margin-left:auto}
.spark .line{fill:none;stroke:var(--faint);stroke-width:1.5}
.spark .dot{fill:var(--faint)}
.spark .dot.sel{fill:var(--accent)}

/* ===== 說明 ===== */
.notes{
  margin-top:36px;
  padding-top:16px;
  border-top:1px solid var(--rule);
  font-size:13px;
  color:var(--muted);
}
.notes h2{margin:0 0 6px;font-size:14px;color:var(--ink)}
.notes ul{margin:0;padding-left:1.2em}
.notes li{margin:2px 0}

@media (max-width:860px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .stat:nth-child(4){border-left:0}
  .stat:nth-child(n+4){border-top:1px solid var(--rule)}
}
@media (max-width:560px){
  .page{width:calc(100% - 28px);padding-top:24px}
  .headline{font-size:17px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat{border-left:0;border-top:1px solid var(--rule)}
  .stat:nth-child(-n+2){border-top:0}
  .stat:nth-child(even){border-left:1px solid var(--rule)}
  .stat:last-child{grid-column:1 / -1}
}
@media print{
  body{background:#fff}
  .month-switch{display:none}
  .group{break-inside:avoid}
}
</style>
</head>
<body>
<main class="page">
  <header class="masthead">
    <div>
      <h1>健保優化提醒月報</h1>
      <p class="period" id="period"></p>
    </div>
    <div class="month-switch">
      <span id="switchLabel">檢視月份</span>
      <div class="seg" id="seg" role="group" aria-labelledby="switchLabel"></div>
    </div>
  </header>

  <p class="headline" id="headline"></p>
  <dl class="stats" id="stats"></dl>

  <div id="groups"></div>

  <section class="notes">
    <h2>資料說明</h2>
    <ul>
      <li>開立率＝開立數 ÷ 提醒數；提醒數為開立（Y）與未開立（N）的合計。</li>
      <li>「較上月」以百分點表示，▲ 為上升、▼ 為下降。</li>
      <li>5–7 月只有開立率，沒有提醒數與開立數，所以只能切換檢視 8 月以後的月份。</li>
      <li>高風險藥物監控自 8 月開始統計。</li>
      <li>標示 * 的項目提醒數未達 100 件，開立率容易因少數個案而大幅變動。</li>
    </ul>
  </section>
</main>

<script>
// ===== 資料設定：新增月份時只需修改本區 =====
const YEAR = 2026;
const MONTHS = [5, 6, 7, 8, 9];
// data 依 MONTHS 順序對齊：
//   數字            = 只有開立率（%）的歷史資料
//   [提醒數, 開立數] = 原始數據
//   null            = 該月尚未統計
const GROUPS = [
  { key:"nhi", label:"健保優化提醒", items:[
    { label:"X光",                    data:[6.7, 6.7, 11.2, [2089,184], [2102,167]] },
    { label:"心超",                   data:[7.1, 6.8, 7.8,  [2080,133], [2269,128]] },
    { label:"保險餘額",               data:[23.5,21.4,24.5, [1299,338], [1307,305]] },
    { label:"腹超-BC肝",              data:[100, 100, 91.3, [140,10],   [153,12]] },
    { label:"膽固醇",                 data:[46.6,39.9,40.4, [479,212],  [551,185]] },
    { label:"是否修改慢箋天數為30天", data:[10.6, 7.2, 5.9, [6276,304], [5602,192]] }
  ]},
  { key:"drug", label:"高風險藥物監控", items:[
    { label:"Blopress plus 加強錠",       data:[null,null,null, [28,7],   [30,19]] },
    { label:"血管張力素受體阻斷劑＋雙效", data:[null,null,null, [50,5],   [51,21]] },
    { label:"利尿劑（保鉀型）",           data:[null,null,null, [343,77], [561,184]] },
    { label:"利尿劑（Thiazide 類）",      data:[null,null,null, [91,18],  [138,46]] },
    { label:"利尿劑（Loop 強效）",        data:[null,null,null, [548,98], [1043,304]] },
    { label:"合成抗利尿激素",             data:[null,null,null, [207,32], [377,65]] }
  ]}
];
const SMALL_N = 100; // 提醒數低於此值標示 *
// ===== 資料設定結束 =====

const ALL = GROUPS.flatMap(g => g.items);
const nf = new Intl.NumberFormat("zh-TW");
const mLabel = i => `${MONTHS[i]} 月`;
const pct = v => v.toFixed(1) + "%";
const isRaw = d => Array.isArray(d);
const rateOf = d => d == null ? null : isRaw(d) ? d[1] / d[0] * 100 : d;

// 可切換的月份：所有項目都有原始數據的月份
const selectable = MONTHS.map((_, i) => i).filter(i => ALL.every(x => isRaw(x.data[i])));
let sel = selectable[selectable.length - 1];

// 合計（該月所有項目都有原始數據才計算）
function totals(list, i){
  if (i < 0 || !list.every(x => isRaw(x.data[i]))) return null;
  const t = list.reduce((s, x) => ({ n:s.n + x.data[i][0], y:s.y + x.data[i][1] }), { n:0, y:0 });
  t.rate = t.y / t.n * 100;
  return t;
}

function deltaHtml(d, unit){
  if (d == null) return `<span class="delta none">—</span>`;
  if (Math.abs(d) < 0.05) return `<span class="delta flat">持平</span>`;
  const cls = d > 0 ? "up" : "down";
  const sym = d > 0 ? "▲" : "▼";
  const val = unit === "pt" ? Math.abs(d).toFixed(1) : nf.format(Math.abs(d));
  return `<span class="delta ${cls} num">${sym} ${val}</span>`;
}

function rateHtml(r){
  return `<span class="rate"><span class="v num">${pct(r)}</span><span class="track"><i style="width:${Math.min(r,100).toFixed(1)}%"></i></span></span>`;
}

function spark(values, selIdx){
  const w = 116, h = 30, pad = 4;
  const valid = values.map((v, i) => ({ v, i })).filter(p => p.v != null);
  if (!valid.length) return `<span class="muted">—</span>`;
  const vs = valid.map(p => p.v);
  // 以 0 為基準，避免微小差異被放大
  const min = 0, max = Math.max(...vs, 1);
  const x = i => values.length === 1 ? w / 2 : pad + i * (w - pad * 2) / (values.length - 1);
  const y = v => h - pad - (v - min) / (max - min) * (h - pad * 2);
  let path = "", prev = false;
  values.forEach((v, i) => {
    if (v == null){ prev = false; return; }
    path += `${prev ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`;
    prev = true;
  });
  const dots = valid.map(p =>
    `<circle class="dot${p.i === selIdx ? " sel" : ""}" cx="${x(p.i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${p.i === selIdx ? 3.2 : 1.8}"/>`
  ).join("");
  const offset = MONTHS.length - values.length;
  const desc = values.map((v, i) => `${mLabel(i + offset)} ${v == null ? "未統計" : pct(v)}`).join("、");
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${desc}"><title>${desc}</title><path class="line" d="${path}"/>${dots}</svg>`;
}

function renderSwitch(){
  const seg = document.getElementById("seg");
  seg.innerHTML = selectable.map(i =>
    `<button type="button" data-i="${i}" aria-pressed="${i === sel}">${mLabel(i)}</button>`
  ).join("");
  seg.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    sel = Number(b.dataset.i);
    render();
  }));
}

function renderOverview(){
  const cur = totals(ALL, sel);
  const prev = totals(ALL, sel - 1);
  document.getElementById("period").textContent = `${YEAR} 年 ${mLabel(sel)}`;
  document.title = `健保優化提醒月報｜${YEAR} 年 ${mLabel(sel)}`;

  let up = 0, down = 0, none = 0;
  ALL.forEach(x => {
    const a = rateOf(x.data[sel]), b = rateOf(x.data[sel - 1]);
    if (b == null) none++;
    else if (a - b >= 0.05) up++;
    else if (b - a >= 0.05) down++;
  });
  let text = `${mLabel(sel)}共 <strong class="num">${nf.format(cur.n)}</strong> 次提醒，整體開立率 <strong class="num">${pct(cur.rate)}</strong>`;
  if (prev){
    const d = cur.rate - prev.rate;
    text += Math.abs(d) < 0.05 ? `，與 ${mLabel(sel - 1)}持平` : `，較 ${mLabel(sel - 1)}${d > 0 ? "上升" : "下降"} ${Math.abs(d).toFixed(1)} 個百分點`;
  }
  text += `。${ALL.length} 個項目中，${up} 項開立率上升、${down} 項下降`;
  if (none) text += `，${none} 項無上月資料可比較`;
  text += "。";
  document.getElementById("headline").innerHTML = text;

  const stats = [
    { label:"提醒數",     value:nf.format(cur.n), d: prev ? cur.n - prev.n : null, unit:"件" },
    { label:"開立數",     value:nf.format(cur.y), d: prev ? cur.y - prev.y : null, unit:"件" },
    { label:"整體開立率", value:pct(cur.rate),    d: prev ? cur.rate - prev.rate : null, unit:"pt" },
    ...GROUPS.map(g => {
      const c = totals(g.items, sel), p = totals(g.items, sel - 1);
      return { label:`${g.label}開立率`, value:pct(c.rate), d: p ? c.rate - p.rate : null, unit:"pt" };
    })
  ];
  document.getElementById("stats").innerHTML = stats.map(s => `
    <div class="stat">
      <dt>${s.label}</dt>
      <dd>
        <span class="value num">${s.value}</span>
        <span class="change">${s.d == null ? "無上月資料" : `較上月 ${deltaHtml(s.d, s.unit)} ${s.unit === "pt" ? "百分點" : "件"}`}</span>
      </dd>
    </div>`).join("");
}

function renderGroups(){
  const last = MONTHS.length - 1;
  document.getElementById("groups").innerHTML = GROUPS.map(g => {
    const start = Math.min(...g.items.map(x => x.data.findIndex(d => d != null)));
    const trendLabel = `${MONTHS[start]}–${MONTHS[last]} 月趨勢`;
    const rows = g.items.map(x => {
      const [n, y] = x.data[sel];
      const r = y / n * 100;
      const pr = rateOf(x.data[sel - 1]);
      const small = n < SMALL_N ? `<span class="small-n" title="提醒數未達 ${SMALL_N} 件">*</span>` : "";
      return `<tr>
        <td class="name">${x.label}${small}</td>
        <td class="num">${nf.format(n)}</td>
        <td class="num">${nf.format(y)}</td>
        <td>${rateHtml(r)}</td>
        <td>${deltaHtml(pr == null ? null : r - pr, "pt")}</td>
        <td>${spark(x.data.slice(start).map(rateOf), sel - start)}</td>
      </tr>`;
    }).join("");
    const t = totals(g.items, sel), tp = totals(g.items, sel - 1);
    const series = MONTHS.slice(start).map((_, k) => { const s = totals(g.items, start + k); return s ? s.rate : null; });
    return `<section class="group" aria-labelledby="g-${g.key}">
      <div class="group-head">
        <h2 id="g-${g.key}">${g.label}</h2>
        <span class="meta">${g.items.length} 項</span>
      </div>
      <div class="table-wrap">
        <table>
          <colgroup>
            <col style="width:29%"><col style="width:11%"><col style="width:11%">
            <col style="width:23%"><col style="width:13%"><col style="width:13%">
          </colgroup>
          <thead><tr>
            <th scope="col">項目</th>
            <th scope="col">提醒數</th>
            <th scope="col">開立數</th>
            <th scope="col">開立率</th>
            <th scope="col">較上月（百分點）</th>
            <th scope="col">${trendLabel}</th>
          </tr></thead>
          <tbody>${rows}</tbody>
          <tfoot><tr>
            <td>小計</td>
            <td class="num">${nf.format(t.n)}</td>
            <td class="num">${nf.format(t.y)}</td>
            <td>${rateHtml(t.rate)}</td>
            <td>${deltaHtml(tp ? t.rate - tp.rate : null, "pt")}</td>
            <td>${spark(series, sel - start)}</td>
          </tr></tfoot>
        </table>
      </div>
    </section>`;
  }).join("");
}

function render(){
  renderSwitch();
  renderOverview();
  renderGroups();
}
render();
</script>
</body>
</html>
